<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Conference Deadlines - Jiyang Lee</title>
    <meta name="author" content="Jiyang Lee">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
    <link rel="shortcut icon" href="images/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <style>
      .dl-wrap {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 0 2.5% 40px;
        box-sizing: border-box;
      }
      .dl-wrap h2 {
        font-size: 22px;
        font-weight: normal;
        margin: 24px 0 4px;
      }
      .dl-wrap p.subtitle {
        font-size: 12px;
        color: #888;
        margin: 0 0 16px;
      }
      table.conf-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table.conf-table th {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 2px solid #ddd;
        font-weight: 700;
        white-space: nowrap;
      }
      table.conf-table td {
        padding: 8px 8px;
        border-bottom: 1px solid #f0f0f0;
        vertical-align: top;
      }
      table.conf-table tr:hover td {
        background-color: #fafafa;
      }
      .conf-name {
        font-weight: 700;
      }
      .conf-full {
        font-size: 11px;
        color: #666;
        margin-top: 2px;
      }
      .badge {
        display: inline-block;
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 10px;
        font-weight: 700;
        vertical-align: middle;
        margin-left: 4px;
      }
      .badge-robotics { background: #dbeafe; color: #1e40af; }
      .badge-ml      { background: #dcfce7; color: #166534; }
      .badge-cv      { background: #fef9c3; color: #854d0e; }
      .badge-journal  { background: #f3e8ff; color: #6b21a8; }
      .badge-control  { background: #ffe4e6; color: #9f1239; }
      .dday {
        font-weight: 700;
        font-size: 15px;
        white-space: nowrap;
      }
      .dday-critical { color: #dc2626; }  /* ≤7 days */
      .dday-warn     { color: #ea580c; }  /* ≤30 days */
      .dday-soon     { color: #ca8a04; }  /* ≤60 days */
      .dday-ok       { color: #16a34a; }  /* >60 days */
      .dday-past     { color: #9ca3af; }  /* closed */
      .date-cell {
        white-space: nowrap;
        font-size: 12px;
      }
      .note-cell {
        font-size: 11px;
        color: #888;
      }
      nav.dl-nav {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 10px 0;
        border-bottom: 1px solid #e0e0e0;
        box-sizing: border-box;
      }
      nav.dl-nav div {
        padding: 0 2.5%;
        display: flex;
        gap: 16px;
        font-size: 13px;
      }
      .filter-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .filter-btn {
        font-size: 12px;
        padding: 3px 10px;
        border: 1px solid #ddd;
        border-radius: 12px;
        cursor: pointer;
        background: #fff;
        color: #444;
        font-family: 'Lato', Verdana, Helvetica, sans-serif;
      }
      .filter-btn.active {
        background: #1772d0;
        color: #fff;
        border-color: #1772d0;
      }
      .last-updated {
        font-size: 11px;
        color: #aaa;
        margin-top: 24px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <nav class="dl-nav">
      <div>
        <a href="index.html" style="color:#1772d0;">Home</a>
        <a href="deadlines.html" style="color:#1772d0;font-weight:700;">Deadlines</a>
      </div>
    </nav>

    <div class="dl-wrap">
      <h2>Conference Deadlines</h2>
      <p class="subtitle">Submission deadlines for robotics, ML, and CV conferences. D-day is counted from today.</p>

      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Robotics">Robotics</button>
        <button class="filter-btn" data-filter="ML">ML</button>
        <button class="filter-btn" data-filter="CV">CV</button>
        <button class="filter-btn" data-filter="Journal">Journal</button>
        <button class="filter-btn" data-filter="Control">Control</button>
      </div>

      <table class="conf-table">
        <thead>
          <tr>
            <th style="width:30%">Conference</th>
            <th>Submission</th>
            <th>Notification</th>
            <th>Conference</th>
            <th style="text-align:center">D-Day</th>
          </tr>
        </thead>
        <tbody id="conf-tbody">
        </tbody>
      </table>

      <p class="last-updated" id="last-updated"></p>
    </div>

    <script>
    const conferences = [
      {
        name: "IROS 2026",
        full: "IEEE/RSJ Intl. Conf. on Intelligent Robots and Systems",
        location: "Abu Dhabi, UAE",
        submission: "2026-03-15",
        notification: "2026-06-21",
        conference: "2026-10-18",
        url: "https://iros2026.org",
        type: "Robotics",
      },
      {
        name: "CoRL 2026",
        full: "Conference on Robot Learning",
        location: "TBD",
        submission: "2026-06-13",
        notification: "2026-09-01",
        conference: "2026-11-09",
        url: "https://corl.org",
        type: "Robotics",
      },
      {
        name: "NeurIPS 2026",
        full: "Neural Information Processing Systems",
        location: "TBD",
        submission: "2026-05-22",
        notification: "2026-09-26",
        conference: "2026-12-06",
        url: "https://neurips.cc",
        type: "ML",
      },
      {
        name: "AAAI 2027",
        full: "AAAI Conference on Artificial Intelligence",
        location: "TBD",
        submission: "2026-08-07",
        notification: "2026-11-20",
        conference: "2027-02-17",
        url: "https://aaai.org",
        type: "ML",
      },
      {
        name: "ICRA 2027",
        full: "IEEE Intl. Conf. on Robotics and Automation",
        location: "TBD",
        submission: "2026-09-15",
        notification: "2027-01-31",
        conference: "2027-05-19",
        url: "https://icra2027.org",
        type: "Robotics",
      },
      {
        name: "ICLR 2027",
        full: "Intl. Conference on Learning Representations",
        location: "TBD",
        submission: "2026-10-02",
        notification: "2027-01-22",
        conference: "2027-04-24",
        url: "https://iclr.cc",
        type: "ML",
      },
      {
        name: "CVPR 2027",
        full: "IEEE/CVF Conf. on Computer Vision and Pattern Recognition",
        location: "TBD",
        submission: "2026-11-14",
        notification: "2027-02-28",
        conference: "2027-06-13",
        url: "https://cvpr.thecvf.com",
        type: "CV",
      },
      {
        name: "RSS 2027",
        full: "Robotics: Science and Systems",
        location: "TBD",
        submission: "2027-01-22",
        notification: "2027-04-01",
        conference: "2027-07-12",
        url: "https://roboticsconference.org",
        type: "Robotics",
      },
      {
        name: "IROS 2027",
        full: "IEEE/RSJ Intl. Conf. on Intelligent Robots and Systems",
        location: "TBD",
        submission: "2027-03-01",
        notification: "2027-06-15",
        conference: "2027-10-01",
        url: "https://iros2027.org",
        type: "Robotics",
        notes: "Dates estimated",
      },
      {
        name: "ACC 2027",
        full: "American Control Conference",
        location: "TBD",
        submission: "2026-09-26",
        notification: "2027-01-15",
        conference: "2027-05-25",
        url: "https://acc2027.a2c2.org",
        type: "Control",
        notes: "Dates estimated",
      },
      {
        name: "CDC 2027",
        full: "IEEE Conference on Decision and Control",
        location: "TBD",
        submission: "2027-03-05",
        notification: "2027-07-15",
        conference: "2027-12-01",
        url: "https://cdc2027.ieeecss.org",
        type: "Control",
        notes: "Dates estimated",
      },
      {
        name: "ICCV 2027",
        full: "IEEE/CVF Intl. Conference on Computer Vision",
        location: "TBD",
        submission: "2027-03-07",
        notification: "2027-07-01",
        conference: "2027-10-11",
        url: "https://iccv.thecvf.com",
        type: "CV",
      },
      {
        name: "RA-L",
        full: "IEEE Robotics and Automation Letters",
        location: "Journal (Rolling)",
        submission: null,
        notification: null,
        conference: null,
        url: "https://www.ieee-ras.org/publications/ra-l",
        type: "Journal",
        notes: "Rolling — ICRA/IROS option available",
      },
      {
        name: "T-RO",
        full: "IEEE Transactions on Robotics",
        location: "Journal (Rolling)",
        submission: null,
        notification: null,
        conference: null,
        url: "https://www.ieee-ras.org/publications/t-ro",
        type: "Journal",
        notes: "Rolling submission",
      },
    ];

    const badgeClass = {
      Robotics: "badge-robotics",
      ML: "badge-ml",
      CV: "badge-cv",
      Journal:  "badge-journal",
      Control:  "badge-control",
    };

    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(dateStr + "T00:00:00");
      return Math.round((target - today) / 86400000);
    }

    function formatDate(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr + "T00:00:00");
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function ddayLabel(days) {
      if (days === null) return { text: "Rolling", cls: "dday-ok" };
      if (days < 0)  return { text: "Closed", cls: "dday-past" };
      if (days === 0) return { text: "Today!", cls: "dday-critical" };
      return { text: `D-${days}`, cls: days <= 7 ? "dday-critical" : days <= 30 ? "dday-warn" : days <= 60 ? "dday-soon" : "dday-ok" };
    }

    let activeFilter = "all";

    function render() {
      const tbody = document.getElementById("conf-tbody");
      const filtered = activeFilter === "all"
        ? conferences
        : conferences.filter(c => c.type === activeFilter);

      // sort: upcoming first by submission date, closed last, rolling at bottom
      const sorted = [...filtered].sort((a, b) => {
        const da = daysUntil(a.submission);
        const db = daysUntil(b.submission);
        if (da === null && db === null) return 0;
        if (da === null) return 1;
        if (db === null) return -1;
        if (da < 0 && db >= 0) return 1;
        if (db < 0 && da >= 0) return -1;
        return da - db;
      });

      tbody.innerHTML = sorted.map(c => {
        const days = daysUntil(c.submission);
        const { text, cls } = ddayLabel(days);
        return `
          <tr data-type="${c.type}">
            <td>
              <div class="conf-name">
                ${c.url ? `<a href="${c.url}" target="_blank" rel="noopener noreferrer">${c.name}</a>` : c.name}
                <span class="badge ${badgeClass[c.type]}">${c.type}</span>
              </div>
              <div class="conf-full">${c.full}</div>
              ${c.location ? `<div class="conf-full">${c.location}</div>` : ""}
              ${c.notes ? `<div class="note-cell">${c.notes}</div>` : ""}
            </td>
            <td class="date-cell">${formatDate(c.submission)}</td>
            <td class="date-cell">${formatDate(c.notification)}</td>
            <td class="date-cell">${formatDate(c.conference)}</td>
            <td style="text-align:center"><span class="dday ${cls}">${text}</span></td>
          </tr>`;
      }).join("");
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        render();
      });
    });

    render();

    document.getElementById("last-updated").textContent =
      "Updated: " + new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    </script>
  </body>
</html>
